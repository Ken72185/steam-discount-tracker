<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Price Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">
    
    <div class="max-w-4xl mx-auto px-6 py-12">
        <h1 class="text-5xl font-extrabold mb-2 gradient-text">Price Tracker</h1>
        <p class="text-slate-400 mb-10">Cek harga game favorit lo secara real-time.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="glass p-6 rounded-3xl border border-slate-700 hover:border-yellow-500 transition-all duration-300">
                <h2 class="text-xl font-bold mb-4">Cyberpunk 2077</h2>
                <button onclick="fetchPrice('1091500', this)" 
                        class="w-full bg-slate-800 hover:bg-yellow-600 border border-slate-600 py-3 rounded-xl font-bold transition-all">
                    Cek Harga IDR
                </button>
            </div>

            <div class="glass p-6 rounded-3xl border border-slate-700 hover:border-yellow-500 transition-all duration-300">
                <h2 class="text-xl font-bold mb-4">Elden Ring</h2>
                <button onclick="fetchPrice('1245620', this)" 
                        class="w-full bg-slate-800 hover:bg-yellow-600 border border-slate-600 py-3 rounded-xl font-bold transition-all">
                    Cek Harga IDR
                </button>
            </div>
        </div>
    </div>

    <script>
        async function fetchPrice(appId, btn) {
            const originalText = btn.innerText;
            btn.innerText = "Mengecek...";
            btn.disabled = true;

            try {
                const res = await fetch(`/api/deals?appId=${appId}`);
                const data = await res.json();
                
                // Cek isi data di console
                console.log(data); 

                // Menyesuaikan dengan struktur data GG.deals
                if (data && data.lowestPrice) {
                    btn.innerText = `Rp ${data.lowestPrice.amount.toLocaleString('id-ID')}`;
                    btn.classList.replace("bg-slate-800", "bg-green-600");
                } else {
                    btn.innerText = "Harga Normal";
                }
            } catch (e) {
                btn.innerText = "Gagal";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
