<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Discount Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-black mb-8 text-yellow-500">Steam Discount Tracker</h1>
        
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Cari nama game..." 
                   class="bg-slate-800 p-4 rounded-xl border border-slate-700 w-full outline-none focus:border-yellow-500">
            <select id="sortBy" onchange="applyFilters()" class="bg-slate-800 p-4 rounded-xl border border-slate-700 w-full md:w-48">
                <option value="default">Urutkan Harga</option>
                <option value="low">Termurah</option>
                <option value="high">Termahal</option>
            </select>
        </div>

        <div id="gameList" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p id="loader" class="text-slate-400">Sedang menarik data...</p>
        </div>
    </div>

    <script>
        const KURS = 15800;
        let allGames = [];

        async function fetchGames() {
            try {
                const res = await fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1&pageSize=60');
                allGames = await res.json();
                applyFilters();
                document.getElementById('loader').classList.add('hidden');
            } catch (e) {
                document.getElementById('loader').innerText = "Gagal memuat data.";
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const sort = document.getElementById('sortBy').value;
            let filtered = allGames.filter(g => g.title.toLowerCase().includes(search));
            if (sort === 'low') filtered.sort((a, b) => a.salePrice - b.salePrice);
            if (sort === 'high') filtered.sort((a, b) => b.salePrice - a.salePrice);
            renderGames(filtered);
        }

        function renderGames(games) {
            const container = document.getElementById('gameList');
            container.innerHTML = games.map(g => `
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 transition-all duration-300 
                            hover:-translate-y-2 hover:border-yellow-500 hover:shadow-2xl hover:shadow-yellow-500/20">
                    <img src="${g.thumb}" class="rounded-xl mb-4 w-full h-40 object-cover" alt="${g.title}">
                    <h2 class="font-bold text-lg mb-2 truncate">${g.title}</h2>
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-green-600 px-2 py-1 rounded text-xs font-bold">-${Math.round(g.savings)}%</span>
                        <span class="text-xl font-black">Rp ${Math.round(g.salePrice * KURS).toLocaleString('id-ID')}</span>
                    </div>
                    <a href="steam://store/${g.steamAppID}" 
                       class="block text-center w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700 transition">
                       BUKA DI STEAM APP
                    </a>
                </div>
            `).join('');
        }

        fetchGames();
    </script>
</body>
</html>
