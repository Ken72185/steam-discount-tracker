<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Price Tracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); }
        .gradient-text { background: linear-gradient(to right, #fbbf24, #f59e0b); -webkit-background-clip: text; color: transparent; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans p-6">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-5xl font-black mb-2 gradient-text">Steam Price Tracker</h1>
        <p class="text-slate-400 mb-10">Cek harga game diskon dalam Rupiah (IDR).</p>

        <div id="gameList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>

        <div class="text-center mt-12">
            <button id="loadMore" onclick="renderNext()" class="hidden bg-yellow-600 hover:bg-yellow-500 px-8 py-3 rounded-full font-bold transition-all">
                Load More Games
            </button>
        </div>
    </div>

    <script>
        let allGames = [];
        let index = 0;

        async function init() {
            const list = document.getElementById('gameList');
            list.innerHTML = "Memuat daftar diskon...";
            try {
                const res = await fetch('/api/games');
                const data = await res.json();
                allGames = data.list || [];
                list.innerHTML = "";
                renderNext();
            } catch (e) { list.innerHTML = "Gagal memuat list."; }
        }

        function renderNext() {
            const list = document.getElementById('gameList');
            const end = index + 6;
            allGames.slice(index, end).forEach(g => {
                list.innerHTML += `
                    <div class="glass p-5 rounded-3xl border border-slate-700 hover:border-yellow-500 transition-all">
                        <img src="${g.thumb}" class="w-full h-32 object-cover rounded-2xl mb-4">
                        <h2 class="font-bold mb-4 h-12 truncate">${g.title}</h2>
                        <button onclick="getPrice('${g.steamAppID}', this)" 
                                class="w-full bg-slate-800 hover:bg-yellow-600 border border-slate-600 py-3 rounded-xl font-bold transition-all">
                            Cek Harga IDR
                        </button>
                    </div>
                `;
            });
            index = end;
            document.getElementById('loadMore').classList.toggle('hidden', index >= allGames.length);
        }

        async function getPrice(appId, btn) {
            btn.innerText = "Mengambil...";
            try {
                const res = await fetch(`/api/price?appId=${appId}`);
                const data = await res.json();
                btn.innerText = data.final_formatted;
                btn.classList.replace("bg-slate-800", "bg-green-700");
            } catch (e) { btn.innerText = "Gagal"; }
        }

        init();
    </script>
</body>
</html>
