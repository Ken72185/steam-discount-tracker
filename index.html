<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Steam Deals Hunter</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-black mb-2 text-yellow-500">Steam Deals Hunter</h1>
        <div id="status" class="text-slate-400 mb-8">Status: Menghubungkan...</div>

        <div id="gameList" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        <button id="loadMore" onclick="render()" class="mt-8 hidden bg-yellow-600 px-6 py-3 rounded-xl w-full font-bold">Load More</button>
    </div>

    <script>
        let allGames = [];
        let index = 0;

        async function init() {
            const status = document.getElementById('status');
            try {
                status.innerText = "Mengambil data dari API...";
                const res = await fetch('/api/deals');
                const data = await res.json();
                
                if (data.list && data.list.length > 0) {
                    allGames = data.list;
                    status.innerText = `Ditemukan ${allGames.length} game diskon!`;
                    render();
                } else {
                    status.innerText = "Error: " + JSON.stringify(data);
                }
            } catch (e) {
                status.innerText = "Gagal total: " + e.message;
            }
        }

        function render() {
            const container = document.getElementById('gameList');
            const btn = document.getElementById('loadMore');
            const end = index + 6;
            
            allGames.slice(index, end).forEach(g => {
                container.innerHTML += `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-700">
                        <img src="${g.thumb}" class="rounded w-full h-32 object-cover mb-2">
                        <h2 class="font-bold truncate">${g.title}</h2>
                        <p class="text-yellow-500 font-bold">${g.price.final.formatted}</p>
                    </div>
                `;
            });
            
            index = end;
            if (index < allGames.length) btn.classList.remove('hidden');
            else btn.classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
