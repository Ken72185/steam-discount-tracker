<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Discount Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-black mb-8 text-yellow-500">Steam Discount Tracker</h1>
        
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Cari nama game..." 
                   class="bg-slate-800 p-4 rounded-xl border border-slate-700 w-full outline-none focus:border-yellow-500">
        </div>

        <div id="gameList" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p id="loader" class="text-slate-400">Sedang menarik data...</p>
        </div>
    </div>

    <script>
        let allGames = [];

        async function fetchGames() {
            const res = await fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1&pageSize=30');
            allGames = await res.json();
            renderGames(allGames);
        }

        // Fungsi baru: Panggil proxy Vercel buat dapet harga asli
        async function fetchRealPrice(appId, btnElement) {
            btnElement.innerText = "Mengecek...";
            try {
                const response = await fetch(`/api/price?appid=${appId}`);
                const data = await response.json();
                
                if (data[appId]?.success) {
                    const price = data[appId].data.price_overview?.final_formatted || "Gratis";
                    btnElement.innerText = price;
                    btnElement.classList.replace("bg-slate-700", "bg-green-700");
                } else {
                    btnElement.innerText = "Gagal";
                }
            } catch (e) {
                btnElement.innerText = "Error";
            }
        }

        function renderGames(games) {
            const container = document.getElementById('gameList');
            container.innerHTML = games.map(g => `
                <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 transition-all hover:-translate-y-2 hover:border-yellow-500">
                    <img src="${g.thumb}" class="rounded-xl mb-4 w-full h-40 object-cover">
                    <h2 class="font-bold text-lg mb-2 truncate">${g.title}</h2>
                    
                    <button onclick="fetchRealPrice('${g.steamAppID}', this)" 
                            class="w-full bg-slate-700 py-2 rounded-lg text-sm font-bold mb-2 hover:bg-slate-600">
                            Cek Harga IDR Resmi
                    </button>

                    <a href="steam://store/${g.steamAppID}" class="block text-center w-full bg-blue-600 py-3 rounded-xl font-bold hover:bg-blue-700">
                       BUKA DI STEAM
                    </a>
                </div>
            `).join('');
        }

        fetchGames();
    </script>
</body>
</html>
